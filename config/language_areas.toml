# 言語圏 → 世界地図の国・地域（ADR 0049・2026-10-15 改訂）。世界地図は投稿者の所在地ではなく、観測した言語が使われる地域の広がりを示す。
# 国・地域と言語圏は多対多。集計は言語圏の単位で、国で人数・作品を足さない。
#
# 国ごとの言語の役割（公用語かどうかでは決めない。社会での役割・実際の使用・地域差で判断し、理由を why に書く。固定の割合の閾値は使わない）:
#   primary   = 主要な社会言語: その国の多数が日常的に使う言語（地図: 塗り。主要な言語が 2 つ以上なら太い縞）
#   shared    = 共通語・第二言語: 行政・教育・報道・都市の共通語として広く使われるが、多数の日常の言語ではない（地図: 細い斜線。国全体を代表させない）
#   regional  = 国の一部の地域・少数の人だけの言語（地図: 塗らない）
#   uncertain = 使用の実態・位置づけが確かめられない・変わりつつある（地図: 塗らない）
# 出典と確認時点（2026-10-15）: 各国の国勢調査（インド 2011・南アフリカ 2022・カナダ 2021・アンゴラ 2014 など）、OIF「La langue française dans le monde 2022」
#   の国別のフランス語話者の推計（Wikipedia「Geographical distribution of French speakers」経由）、Wikipedia の各国の言語の記事（Languages of India / Nigeria /
#   South Africa / Canada ほか）。国の言語の事情は変わるので、変えたときは why と確認時点を書き直す。
# 地図の SVG にない小さな国・地域（シンガポール・マカオ・マルタ・バーレーン・モーリシャスなど）は塗れない（一覧・言語ページには出る）。
# 新しい言語を観測したら、ここに言語圏を足すだけで地図に出る。

# 本番の地図でこの対応表を使うか（承認の後に true。開発の Viewer は常に使う）
enabled = true                 # 2026-10-15 のユーザーの指示（開発 8766 の完成済みの表示を本番へ）で本番に適用（承認事項 A4）

[areas.en]
primary = ["us", "gb", "ie", "ca", "au", "nz", "jm", "bs", "tt", "gy", "ag", "kn", "vi", "vg", "fk", "gs", "tc"]
shared = ["in", "pk", "lk", "ng", "gh", "ke", "ug", "tz", "zm", "zw", "mw", "bw", "na", "ls", "sz", "lr", "sl", "gm", "ss", "cm", "za",
          "ph", "my", "bn", "pg", "fj", "sb", "ws", "to", "ki", "ae", "pr", "bz"]
uncertain = ["bd", "er", "sd", "rw", "bi", "vu", "il"]
[areas.en.why]
in = "国勢調査 2011: 英語を第一言語とする人 0.02%、第二・第三言語を含めて 10.6%。行政・教育・ビジネスの共通語。主な言語は地域ごとに異なる（ヒンディー語 43.6% など）"
pk = "公用語・行政と高等教育の言語。日常はパンジャーブ語・ウルドゥー語など"
