# Game の取得元の候補の台帳（2026-11-08 作成。Claude の調査）。PC・家庭用機のプレイヤーの声を集める場の候補。
# 書式は Anime（projects/anime-signal-scout/config/source_candidates.toml）の『記録する事実』を写し、表の形は [candidates.<id>] にした。
# 既に取り込み済みの Bluesky・Steam のユーザーレビュー（steam_reviews）・ProtonDB・Steam の上位（steam_charts）・Steam の作品情報は含めない。
# 並びは優先度の順（量 × 作品の同定のしやすさ × 言語の広さ）。needs_key・needs_decision も優先度は下げず、unblock に外す手順を書く（本人の指示 2026-11-08）。
#
# 欄:
#   name / url / langs        名前・入口・言語（多言語 = 多数の言語が混在）
#   voice                     何を 1 つの『声』と数えるか（レビュー・投稿・返信・コメント）
#   access / endpoint         取得方法（API / RSS / HTML）と具体の URL の形
#   game_id / game_id_note    作品の同定のしやすさ: easy（URL・板・ID = 作品）/ medium（題名・タグで照合）/ hard（本文の自由文）
#   auth                      鍵・ログインの要否（秘密は書かない）
#   robots / terms / terms_url  robots.txt の該当行と、規約の要点（短い引用か『未確認』）と根拠の URL
#   volume                    実測できた量（『未実測』『未確認の推測』を明記）
#   verified / verification   何をいつ取得したか。verification = content（内容まで取得）/ robots（robots・文書だけ）/ none（今回は取得せず他の台帳の転記）
#   verdict                   ready（鍵・契約なしで今すぐ実装できる）/ needs_key（無料の鍵が要る・本人が作る）/ needs_decision（規約が不明確・本人の判断）/ rejected（規約の明確な禁止・範囲外・遮断・停止）
#   unblock                   needs_key・needs_decision を外す具体の手順（どの鍵をどこで作るか・どの条項を確認するか）
#   reject_reason / alternatives  不採用の理由と、ほかの正当な道
#   priority                  優先度の順位（1 が最優先）
# 『未確認』は禁止ではない。取得の速さは 1 ホストあたり 2 秒以上の間隔、UA は daily.toml と同じ（連絡先なし）で調べた。

