# 運用の設定（ops/runner）。秘密は書かない。

[daily_run]
jobs = ["collect", "normalize", "observe", "analyze", "insight", "digest", "publish"]   # publish = Viewer が読む表 public_document の置き換え（外への公開ではない）
max_attempts = 3              # 再試行は呼ぶ側の 1 層だけ。上限と待ちはここに 1 か所
retry_after_minutes = 30
max_running_hours = 6         # running のまま残った実行を abandoned で閉じる目安
user_agent = "game-signal-scout/0.0.1 (+https://github.com/bepro-engineer/game-signal-scout; non-commercial)"

[insight]
# プレイヤーの発見（services/insight。#2 の 6721630085: 「世界で広がる作品」の置き換え。オーナーの指示で再開 2026-11-08）。
# 発言から具体的な体験（何をした → 何が起きた → 面白い／不満）を取り出し、同じ体験をまとめて人数を数える。共有の LLM の枠を通す
enabled = false               # 実データで時間を測り、共有の LLM の枠を長くふさがないと確かめてから有効にする（2026-11-08）
model = "gemma4:12b-it-q4_K_M"   # 今日の兆しと同じモデル
window_days = 7               # 直近の窓（前の窓も同じ長さ。比べて new・up・same・down）
max_per_window = 150          # 窓ごとに読む投稿者の数（1 人 1 件）
max_reads_per_run = 150       # 1 作品で 1 回に新しく読む発言の数（読んだ結果は残し、次の回は新しい発言だけ）
min_people = 2                # 直近の窓で、同じ体験を書いた独立した投稿者がこれ以上のときに発見にする（1 人の体験は singles に、そう明記して残す）
min_statements = 30           # 直近の窓にこれ以上の発言がある作品だけ読む
max_games = 12                # 対象の作品の数（発言の多い順）
max_per_run = 6               # 1 回の日次で読む作品の数
timeout_seconds = 1800        # 共有の枠の順番待ちを含む

[analysis]
# 「遊べなくなった・直った」の検出（Issue #1 の検証P で事前に固定した規則。変えたら version を上げる）
version = "p-2026-11-07"
window_days = 14
prev_days = 60
min_key_reports = 5           # 窓の失敗（直った側は成功）の報告の下限
min_distinct_configs = 5      # そのうち異なる機材構成の下限（投稿者の ID がないので代わりに使う）
min_prev_reports = 5          # 直前の期間の報告の下限
min_jump = 0.30               # 失敗の割合の変化（30 ポイント）

[dashboard_digest]
# 今日の兆し（Anime の ops/dashboard_digest.py を流用。値は Anime の config/daily.toml と同じ。声の取得元だけ Game のもの）
enabled = true
voice_sources = "all"   # 観測の集計に入れているすべての取得元の声を読む（特定の取得元を決め打ちしない。CLAUDE.md）
timeout_seconds = 400
num_ctx = 16384
refresh_days = 3
model = "gemma4:12b-it-q4_K_M"
languages = ["ja", "en", "es", "pt", "fr", "de", "it", "ko", "zh", "tr", "ru", "id"]

[publish]
# Anime の流用（signal/content.py）が読む: 日次の画面の最初の日 = Game が観測を始めた日（2026-11-08 の本人の指摘: 先月の日を出さない）。
# それより前の日は、さかのぼって取ったレビューで「普段」を測るためだけに使い、画面の日にしない
start_day = "2026-11-07"

[web]
analytics_script_src = ""   # Anime の画面の流用が読む（Game はアクセス解析を入れない）
# Viewer（web/app）。利用者の入口は VAIO の共通の入口（家の中 http://192.168.11.3/game/・公開 https://game-signal-scout.com/。Anime と同じ）。ここは VAIO が中継する裏の口で、
# 受けてよい相手を allow_from に限る（この機械と VAIO だけ。ほかは 403）
host = "0.0.0.0"          # VAIO の入口が中継できるように待ち受ける（裏の口。受ける相手は allow_from だけ）
allow_from = ["127.0.0.1/32", "::1/128", "192.168.11.3/32"]   # この機械と VAIO の共通の入口だけ（利用者は VAIO の入口 /game/・公開の名前から開く。特別なポート番号を表に出さない）
port = 8720
pool_min_size = 1
pool_max_size = 4

[launchd]
# 起動の定義（ops/launchd）。python -m game_signal_scout launchd は runtime/launchd に plist を書くだけ（反映は本人の承認の後）
hour = 6                      # daily-run を起動する時刻（機械の時刻）
minute = 15

[collector]
# 常駐の収集器の DB の接続の持ち方（資源の条件による共通の規則。取得元・システムの名前で分けない）。
# 次の周期までの待ち（取得元の poll_seconds）がこれより短い取得元は接続を持ち続け、それ以上なら待つあいだ閉じる
hold_connection_below_seconds = 60
