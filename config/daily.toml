# 運用の設定（ops/runner）。秘密は書かない。

[daily_run]
jobs = ["collect", "normalize", "observe", "analyze", "insight", "digest", "publish"]   # publish = Viewer が読む表 public_document の置き換え（外への公開ではない）
max_attempts = 3              # 再試行は呼ぶ側の 1 層だけ。上限と待ちはここに 1 か所
retry_after_minutes = 30
max_running_hours = 6         # running のまま残った実行を abandoned で閉じる目安
user_agent = "game-signal-scout/0.0.1 (private research; non-commercial)"

[insight]
# プレイヤーの声の読み取り（services/insight。共有の Ollama を共有の枠 scout-llm で使う）
# 2026-11-08: 本人が試行を止めたので無効（再開は本人の判断の後）
enabled = false
model = "qwen2.5:7b"
days = 30                     # 材料にする発言の期間
min_statements = 30           # これ以上の発言がある作品だけ読む
max_games = 40                # 対象の作品の数（発言の多い順）
max_per_run = 12              # 1 回の日次で読む作品の数（1 作品に数分かかる）

[analysis]
# 「遊べなくなった・直った」の検出（Issue #1 の検証P で事前に固定した規則。変えたら version を上げる）
version = "p-2026-11-07"
window_days = 14
prev_days = 60
min_key_reports = 5           # 窓の失敗（直った側は成功）の報告の下限
min_distinct_configs = 5      # そのうち異なる機材構成の下限（投稿者の ID がないので代わりに使う）
min_prev_reports = 5          # 直前の期間の報告の下限
min_jump = 0.30               # 失敗の割合の変化（30 ポイント）

[llm_gate]
# 機械で 1 つの LLM 枠（scout-infra の scout_llm_gate）。Game は専用の LLM・常駐を持たない
enabled = false
config = ""                   # 枠の設定ファイルのパス（scout-infra の config/llm_gate.toml）

[dashboard_digest]
# 今日の兆し（Anime の ops/dashboard_digest.py を流用。値は Anime の config/daily.toml と同じ。声の取得元だけ Game のもの）
enabled = true
voice_sources = ["steam_reviews", "bluesky"]
timeout_seconds = 400
num_ctx = 16384
refresh_days = 3
model = "gemma4:12b-it-q4_K_M"
languages = ["ja", "en", "es", "pt", "fr", "de", "it", "ko", "zh", "tr", "ru", "id"]

[publish]
# Anime の流用（signal/content.py）が読む: 日次の画面の最初の日 = Game が観測を始めた日（2026-11-08 の本人の指摘: 先月の日を出さない）。
# それより前の日は、さかのぼって取ったレビューで「普段」を測るためだけに使い、画面の日にしない
start_day = "2026-11-07"

[web]
analytics_script_src = ""   # Anime の画面の流用が読む（Game はアクセス解析を入れない）
# Viewer（web/app）。待ち受けは自分の機械だけ。公開はしていない
host = "127.0.0.1"
port = 8720
pool_min_size = 1
pool_max_size = 4

[launchd]
poll_minutes = 10        # 短い間隔の収集（ops/poll。config/sources.toml の poll = true の取得元）
# 起動の定義（ops/launchd）。python -m game_signal_scout launchd は runtime/launchd に plist を書くだけ（反映は本人の承認の後）
hour = 6                      # daily-run を起動する時刻（機械の時刻）
minute = 15
