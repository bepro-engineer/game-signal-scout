# 取得元の記述（取得元を作る唯一の入口 sources/factory が読む。取得元の名前で分岐しない）。秘密は書かない。
# enabled = false の取得元は収集しない。

[protondb]
adapter = "game_signal_scout.sources.protondb:ProtonDBDump"
# 公開の配布データ（GitHub bdefore/protondb-data。ODbL 1.0 / DbCL 1.0）。ProtonDB 本体のサイトは取得しない
license = "ODbL-1.0 / DbCL-1.0"
listing_url = "https://api.github.com/repos/bdefore/protondb-data/contents/reports"
file_url = "https://raw.githubusercontent.com/bdefore/protondb-data/master/reports/{name}"
dump = "latest"          # latest = 一覧のいちばん新しい月。月の名前（reports_nov1_2026.tar.gz）も書ける
local_path = ""          # 取得せずに手元の配布データを読む（試験・検証）
batch_size = 2000        # 1 回の保存の件数（この区切りで続きの位置を記録する）
min_snapshot_ratio = 0.9 # 新しい配布物が保存済みのこの割合より少なければ、壊れた配布物の疑いとして削除の追従をしない
retention_days = 0       # 保持期限（日。0 = 無期限）。検証で使う一時の DB では短くする
min_interval_hours = 24  # 前回の成功からこの時間は取りに行かない（配布物は月 1 回。一覧の確認も 1 日 1 回で足りる）
normalizer = "game_signal_scout.services.normalize:protondb"   # 正規化の選び方（取得元の名前で分岐しない）

[steam_reviews]
adapter = "game_signal_scout.sources.steam_reviews:SteamReviews"
enabled = false          # 実際の取得は本人の承認まで無効（Issue #1 6705736617 の B）。試験は偽の応答だけ
endpoint = "https://api.steampowered.com/IUserReviewsService/GetAppReviews/v1/"
appids = []
filter = 1               # 1 = 新しい順（公式文書の列挙値。文字列の "recent" は解釈されない）
languages = ["all"]
num_per_page = 100
max_pages_per_app = 3
retention_days = 30
min_interval_hours = 24

[bluesky]
adapter = "game_signal_scout.sources.bluesky:Bluesky"
normalizer = "game_signal_scout.services.normalize:bluesky"
# 役割: プレイヤーの発言（Anime の sources/bluesky を移植）。Jetstream（公式の live tail。キー不要）。本文を保存し、削除・アカウントの停止に追従する。
# 投稿者は鍵付きの HMAC（runtime/author_hmac.key。did は持たない）。
# 常駐で受信する（resident = true: launchd の collect-bluesky が `source-collect --source bluesky` を動かす。ops/collector。日次の collect は読まない）。
# 常駐は 2026-11-08 に本人が承認（Issue #1）。1 周期 = batch_seconds の間の受信を 1 つの取引で保存。失敗は error_backoff_seconds 待って次へ。
enabled = true
resident = true
error_backoff_seconds = 30
endpoints = ["wss://jetstream.us-east.bsky.network/xrpc/network.bsky.jetstream.subscribeEvents",
             "wss://jetstream.us-west.bsky.network/xrpc/network.bsky.jetstream.subscribeEvents"]
subprotocol = "xrpc.v1.json"
collections = ["app.bsky.feed.post"]
batch_seconds = 30
idle_seconds = 20
switch_rewind_seconds = 60
retention_days = 30
min_interval_hours = 0
# ゲームの文脈の語（検証S・T で使った語）。Steam のストアのリンクは常に対象
context_words = ["game", "games", "gaming", "play", "playing", "played", "patch", "update", "steam", "steam deck", "ps5", "ps4", "playstation",
                 "xbox", "game pass", "nintendo", "switch 2", "pc", "dlc", "season", "boss", "mod", "mods", "bug", "crash", "crashes", "fps",
                 "early access", "patch notes", "indie game", "gamedev", "videogames", "video game", "ゲーム", "プレイ", "アプデ", "攻略",
                 "神ゲー", "クソゲー", "プレステ", "任天堂", "スイッチ2", "游戏", "遊戲", "게임"]
# 一般語と衝突する題名（文脈の語があるときだけ同定する。検証T の事前登録の一覧）
ambiguous_titles = ["Peak", "Hunt", "Rust", "Deadlock", "Overwatch", "The Finals", "Total War", "Dressmaker", "Probably Stolen", "Wardogs",
                    "Enshrouded", "Delta Force", "Once Human", "Black Myth", "Naraka"]
min_title_chars = 8
# 題名の一致に要るゲームに固有の文脈の語（"play"・"season"・"update" などスポーツや一般と共通の語は入れない。2026-11-07 の実データで誤同定の主因だった）
title_context_words = ["game", "games", "gaming", "videogame", "video game", "steam", "steam deck", "ps5", "ps4", "playstation", "xbox",
                       "nintendo", "switch 2", "dlc", "early access", "patch notes", "speedrun", "gamedev", "indie game", "ゲーム", "プレイ",
                       "アプデ", "攻略", "神ゲー", "クソゲー", "プレステ", "任天堂", "游戏", "遊戲", "게임"]

[steam_charts]
adapter = "game_signal_scout.sources.steam_charts:SteamCharts"
normalizer = "game_signal_scout.services.normalize:steam_charts"
# 役割: 遊ばれている規模（Steam の最も遊ばれているゲームの上位 100。キー不要。Oshi Charts と同じ種類）。補助の材料で、満足度の根拠にしない。
# 作品の情報（steam_store）より先に読む（上位の作品も作品の情報を揃える対象になる）
min_interval_hours = 20

[steam_store]
adapter = "game_signal_scout.sources.steam_store:SteamStore"
normalizer = "game_signal_scout.services.normalize:steam_store"
# 役割: 作品の情報（画像・短い説明・ジャンル・遊び方・機種・日本語・発売日）。利用者がゲームを選ぶための項目（game_profile）。レビューは取らない。
# 対象: プレイヤーの報告・発言の多い作品（repositories/catalog.active_apps）のうち、情報がない・refresh_days より古いもの。
active_days = 90
max_games = 150
refresh_days = 30
batch_size = 20
min_interval_hours = 20
