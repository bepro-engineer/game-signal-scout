# 取得元の記述（取得元を作る唯一の入口 sources/factory が読む。取得元の名前で分岐しない）。秘密は書かない。
# enabled = false の取得元は収集しない。

[protondb]
adapter = "game_signal_scout.sources.protondb:ProtonDBDump"
# 公開の配布データ（GitHub bdefore/protondb-data。ODbL 1.0 / DbCL 1.0）。ProtonDB 本体のサイトは取得しない
license = "ODbL-1.0 / DbCL-1.0"
listing_url = "https://api.github.com/repos/bdefore/protondb-data/contents/reports"
file_url = "https://raw.githubusercontent.com/bdefore/protondb-data/master/reports/{name}"
dump = "latest"          # latest = 一覧のいちばん新しい月。月の名前（reports_nov1_2026.tar.gz）も書ける
local_path = ""          # 取得せずに手元の配布データを読む（試験・検証）
batch_size = 2000        # 1 回の保存の件数（この区切りで続きの位置を記録する）
min_snapshot_ratio = 0.9 # 新しい配布物が保存済みのこの割合より少なければ、壊れた配布物の疑いとして削除の追従をしない
retention_days = 0       # 保持期限（日。0 = 無期限）。検証で使う一時の DB では短くする
min_interval_hours = 24  # 前回の成功からこの時間は取りに行かない（配布物は月 1 回。一覧の確認も 1 日 1 回で足りる）
normalizer = "game_signal_scout.services.normalize:reports"   # 正規化の選び方（取得元の名前で分岐しない）

[steam_reviews]
adapter = "game_signal_scout.sources.steam_reviews:SteamReviews"
normalizer = "game_signal_scout.services.normalize:voices"
# 役割: プレイヤーの声（肯定・否定・遊んだ時間つき）。AI が読んで、作品ごとの体験・満足と不満・変化をまとめる材料（services/insight）。
# 2026-11-08 から使う（Issue #2「権利に振り回されすぎ、一切気にするな」を受けた判断。非公開・非商用。止めるときは enabled = false にして保存分を消す）
enabled = true
endpoint = "https://api.steampowered.com/IUserReviewsService/GetAppReviews/v1/"
appids = []              # 空なら、プレイヤーの報告・発言・遊ばれている規模の多い作品（max_games まで）
max_games = 60
active_days = 90
filter = 1               # 1 = 新しい順（公式文書の列挙値）
languages = ["all"]
num_per_page = 100
max_pages_per_app = 400   # 量の多い作品の 28 日分（約 3 万件）まで遡れる上限。過去がそろった作品は保存済みに届いたら止まる
max_age_days = 28        # 28 日前より古いレビューに届いたら、その作品を終える（観測の集計の 28 日の系列）
retention_days = 60
resident = true
poll_seconds = 86400

[steam_charts]
adapter = "game_signal_scout.sources.steam_charts:SteamCharts"
normalizer = "game_signal_scout.services.normalize:activity"
# 役割: 遊ばれている規模（Steam の最も遊ばれているゲームの上位 100。キー不要。Oshi Charts と同じ種類）。補助の材料で、満足度の根拠にしない。
# 作品の情報（steam_store）より先に読む（上位の作品も作品の情報を揃える対象になる）
min_interval_hours = 20

[steam_discussions]
# 保留（2026-11-08 オーナー: Steam の利用規約 4.C に関わる Steam の掲示板・ワークショップ・告知へのコメントの 3 件は取得を保留・除外し、ほかの取得元で続ける）
enabled = false
adapter = "game_signal_scout.sources.steam_discussions:SteamDiscussions"
normalizer = "game_signal_scout.services.normalize:voices"
# 役割: プレイヤーの声（Steam コミュニティの作品ごとの総合の掲示板。話題と返信。多言語。キー不要）。作品は掲示板で決まる
# 対象: 遊ばれている・話題の多い作品（max_games）と、これから発売の作品の上位（upcoming_games。発売前の期待・不安）
max_games = 60
upcoming_games = 30
active_days = 90
list_pages = 2
max_topics = 20
min_interval_hours = 6

[steam_upcoming]
adapter = "game_signal_scout.sources.steam_upcoming:SteamUpcoming"
normalizer = "game_signal_scout.services.normalize:upcoming"
# 役割: これから発売の作品（Steam の人気の近日発売の上位。キー不要）。Anime の「まもなく放送」に当たる（画面のメニューの下の枠・api/soon）。
# 作品の情報（steam_store）より先に読む（一覧の作品も作品の情報を揃える対象になる）
max_items = 100
min_interval_hours = 20

[steam_assets]
adapter = "game_signal_scout.sources.steam_assets:SteamAssets"
normalizer = "game_signal_scout.services.normalize:assets"
# 役割: 作品の画像の場所（縦長の表紙・横長の帯。IStoreBrowseService/GetItems。キー不要・50 作品ずつ）。画面の作品の画像の枠は縦長（Anime と同じ）
min_interval_hours = 20

[steam_store]
adapter = "game_signal_scout.sources.steam_store:SteamStore"
normalizer = "game_signal_scout.services.normalize:profiles"
# 役割: 作品の情報（画像・短い説明・ジャンル・遊び方・機種・日本語・発売日）。利用者がゲームを選ぶための項目（game_profile）。レビューは取らない。
# 対象: プレイヤーの報告・発言の多い作品（repositories/catalog.active_apps）のうち、情報がない・refresh_days より古いもの。
active_days = 90
max_games = 150
refresh_days = 30
batch_size = 20
min_interval_hours = 20

