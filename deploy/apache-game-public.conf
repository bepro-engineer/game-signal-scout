# 外部公開のホスト名 game-signal-scout.com（Issue #6）。置き場所: VAIO の /etc/apache2/sites-available/30-game-public.conf（有効化して reload）。
# Anime の 20-anime-public.conf と同じ形: インターネットからの要求は Cloudflare Tunnel（VAIO の常駐 cloudflared）がこの名前で http://localhost:80 へ渡す（Anime と同じ行き先。公開の名前のルートの URL は localhost:80）。
# この名前で出すのは Game の画面（Mac mini 192.168.11.8:8720。読むだけ）だけ。HTTPS は Cloudflare の側で終える（ここは Tunnel の内側の http）。
<VirtualHost *:80>
    ServerName game-signal-scout.com
    ServerAlias www.game-signal-scout.com
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC,OR]
    RewriteCond %{HTTP:X-Forwarded-Proto} =http
    RewriteRule ^/(.*)$ https://game-signal-scout.com/$1 [R=301,L]

    # 稼働の確認の口は外に出さない
    <Location "/healthz">
        Require all denied
    </Location>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 30
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /healthz !
    ProxyPass        / http://192.168.11.8:8720/
    ProxyPassReverse / http://192.168.11.8:8720/

    <Location "/">
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always set Strict-Transport-Security "max-age=31536000"
        AddOutputFilterByType DEFLATE application/json text/html text/css application/javascript
    </Location>
    ErrorLog ${APACHE_LOG_DIR}/game_public_error.log
    CustomLog ${APACHE_LOG_DIR}/game_public_access.log combined
</VirtualHost>
