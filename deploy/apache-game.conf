# Game Signal Scout を /game/ に（Anime の deploy/apache-anime.conf と同じ形）。置き場所: VAIO の /etc/apache2/viewers.d/game.conf（共通の入口 10-viewers.conf が読む）。
# 家の中の入口は http://192.168.11.3/game/（Anime の /anime/ と同じ）。利用者は特別なポート番号を使わない。
# 中継先は Mac mini の画面（家の中だけの裏の口。受ける相手は Mac mini 自身と VAIO だけ: config/daily.toml の [web] allow_from）。
RedirectMatch 308 ^/game$ /game/

ProxyPass        /game/healthz !
ProxyPass        /game/ http://192.168.11.8:8720/
ProxyPassReverse /game/ http://192.168.11.8:8720/

<Location "/game/healthz">
    Require all denied
</Location>
<Location "/game/">
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    AddOutputFilterByType DEFLATE application/json text/html text/css application/javascript
</Location>
