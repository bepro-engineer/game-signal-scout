<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title_ja }} | Game Signal Scout</title>
<meta name="title-en" content="{{ page.title_en }} | Game Signal Scout">
<link rel="icon" href="static/favicon.svg?v={{ ver }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
{% for css in stylesheets %}<link rel="stylesheet" href="static/{{ css }}?v={{ ver }}">
{% endfor %}</head>
<body>
<div class="app">
<header class="top"><img src="static/site-header.jpg" alt="Game Signal Scout"></header>
<div class="sidecol"><nav class="side" id="nav" aria-label="pages"></nav><section class="soon" id="soon" hidden></section></div>
{{ main }}
</div>
<script src="static/common.js?v={{ ver }}"></script>
<script src="static/foot.js?v={{ ver }}"></script>
{% if page.script %}{% for extra in page.extra_scripts %}<script src="static/{{ extra }}?v={{ ver }}"></script>
{% endfor %}<script src="static/boot.js?v={{ ver }}" data-need="{{ page.data }}" data-run="static/{{ page.script }}?v={{ ver }}"></script>
{% endif %}</body>
</html>
