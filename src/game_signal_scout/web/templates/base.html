<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>{% block title %}{% endblock %} | Game Signal Scout</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<header class="site">
<a class="hero" href="/" aria-label="Game Signal Scout トップへ">
<img src="/static/site-header.jpg" srcset="/static/site-header-1100.jpg 1100w, /static/site-header.jpg 2172w" sizes="(max-width: 1120px) 100vw, 1120px"
 width="2172" height="724" alt="Game Signal Scout（Beta） 世界のゲームの「いま」を見つける">
</a>
<nav class="nav" aria-label="ページ">
<a href="/"{% if nav == 'top' %} class="on" aria-current="page"{% endif %}>変化の一覧</a>
<a href="/about"{% if nav == 'about' %} class="on" aria-current="page"{% endif %}>このサイトについて</a>
<span class="tag">非公開の試作</span>
</nav>
</header>
{% if health and health.stale %}<p class="notice">最後の作り直しに失敗したため、前回の内容を表示しています。</p>{% endif %}
<main class="{% block mainclass %}{% endblock %}">
{% block main %}{% endblock %}
</main>
<footer class="site">
<p>プレイヤーの報告: <a href="https://github.com/bdefore/protondb-data">ProtonDB の公開配布データ</a>（ODbL 1.0 / DbCL 1.0）を加工しています。Valve・ProtonDB とは関係ありません。</p>
<p>非公開の試作です。内容を作った時刻: {{ health.built_at|ts if health else '—' }}</p>
</footer>
</body>
</html>
